name: Nintendo Museum watcher

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer juste une notif de test"
        type: boolean
        default: false
      dates:
        description: "Dates a tester (ex: 2026-11-20), vide = ton voyage"
        type: string
        default: ""

concurrency:
  group: watcher-${{ inputs.dates != '' && 'essai' || 'main' }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ inputs.test || 'false' }}
          TARGET_DATES: ${{ inputs.dates != '' && inputs.dates || '2026-10-14,2026-10-15,2026-10-16,2026-10-17,2026-10-18' }}
          RUN_FOR_MINUTES: ${{ inputs.dates != '' && '3' || '55' }}
